<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Welcome | VillaCharlenne</title>

<meta http-equiv="refresh" content="4;url=home">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
font-family:'Poppins',sans-serif;
background:linear-gradient(rgba(0,0,0,0.5),rgba(0,0,0,0.5));
background-size:cover;
background-position:center;
color:white;
text-align:center;
overflow:hidden;
}

/* container */

.welcome-box{
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.08);
padding:60px 70px;
border-radius:20px;
border:1px solid rgba(255,255,255,0.2);
box-shadow:0 25px 60px rgba(0,0,0,0.3);
animation:fadeIn 1.2s ease;
}

/* title */

.welcome-box h1{
font-family:'Playfair Display',serif;
font-size:50px;
letter-spacing:2px;
margin-bottom:15px;
}

/* subtitle */

.welcome-box p{
font-size:16px;
opacity:0.9;
margin-bottom:30px;
}

/* loader */

.loader{
width:50px;
height:50px;
border:4px solid rgba(255,255,255,0.2);
border-top:4px solid #ffffff;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;
}

/* animations */

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

@keyframes fadeIn{
0%{
opacity:0;
transform:translateY(30px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

</style>

</head>

<body>

<div class="welcome-box">

<h1>Welcome to VillaCharlenne</h1>

<p>Your luxury escape begins here ...</p>

<div class="loader"></div>

</div>

</body>
</html>
